name: placar-volei

services:
  placar:
    build:
      context: .
      dockerfile: Dockerfile
    image: placar-volei:local
    container_name: placar-volei
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_PATH=/data/placar.db
      - OWNER_SECRET=${OWNER_SECRET:-troque-este-segredo-em-producao}
      - ADMIN_TIMEOUT_SECONDS=${ADMIN_TIMEOUT_SECONDS:-120}
      - MAX_ARENAS=${MAX_ARENAS:-50}
      - MAX_QUADRAS_POR_ARENA=${MAX_QUADRAS_POR_ARENA:-20}
      - MAX_PARTICIPANTES_POR_QUADRA=${MAX_PARTICIPANTES_POR_QUADRA:-50}
    volumes:
      - placar-dados:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  placar-dados:
    name: placar-volei-dados

name: placar-volei

services:
  placar:
    build:
      context: .
      dockerfile: Dockerfile
    image: placar-volei:local
    container_name: placar-volei
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_PATH=/data/placar.db
      - GERENCIADOR_DB_PATH=/data-gerenciador/gerenciador.db
      - DEFAULT_ARENAS_FILE=/srv/fixtures/defaultArenas.json
      - MAX_QUADRAS=${MAX_QUADRAS:-20}
      - QUADRA_TTL_SECONDS=${QUADRA_TTL_SECONDS:-3600}
      - WATCH_AUTO_GRANT=${WATCH_AUTO_GRANT:-eli}
      - TRUST_CLOUDFLARE=${TRUST_CLOUDFLARE:-true}
      - OWNER_SECRET=${OWNER_SECRET:?defina OWNER_SECRET no .env}
      - PRODUCAO=true
      # Banco efêmero por decisão do Navigator (2026-09-27): cada start do
      # contêiner começa limpo; em falha, a quadra é recriada remotamente.
      - RESET_DB_ON_STARTUP=true
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ADMIN_TIMEOUT_SECONDS=${ADMIN_TIMEOUT_SECONDS:-120}
      - MAX_ARENAS=${MAX_ARENAS:-50}
      - MAX_QUADRAS_POR_ARENA=${MAX_QUADRAS_POR_ARENA:-20}
      - MAX_PARTICIPANTES_POR_QUADRA=${MAX_PARTICIPANTES_POR_QUADRA:-20}
    volumes:
      - ./fixtures:/srv/fixtures
      # Dado durável (CV8): não é apagado pelo RESET_DB_ON_STARTUP.
      - gerenciador-dados:/data-gerenciador
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gerenciador-dados:
